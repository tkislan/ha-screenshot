name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm test

  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: github/gh-actions-lock@verify/v0.5.1

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: tkislan/ha-screenshot
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build for the smoke test
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ha-screenshot:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker image ls ha-screenshot:smoke
          docker run --detach --name smoke --publish 8080:8080 \
            --env HA_URL=http://127.0.0.1:9 --env HA_TOKEN=unused --env ENGINE_PASSWORD=smoke \
            ha-screenshot:smoke
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          test "$(docker exec smoke id -u)" = 1000
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/lovelace/0)" = 401
      - name: Smoke test container logs
        if: always()
        run: docker logs smoke || true
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4.8.0
        with:
          username: tkislan
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Image tag, labels and annotations
        id: meta
        uses: docker/metadata-action@v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=1.0.${{ github.run_number }}
      - name: Push on main
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
